<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODM Soldier Terminal | Dev: KIM POGI</title>
    <link rel="stylesheet" href="newlogin.css">
</head>
<body>

    <div class="terminal-container">
        <div id="loginCard" class="card">
            <div class="glitch-wrapper">
                <h2 class="glitch" data-text="SYSTEM LOGIN">CALL OF DUTY LOGIN</h2>
            </div>
            
            <div class="input-group">
                <label>SOLDIER IDENTIFICATION</label>
                <input type="text" id="username" placeholder="ENTER IGN..." autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>TERMINAL ACCESS UID</label>
                <input type="password" id="uid" placeholder="ENTER UID...">
            </div>

            <div class="input-group">
                <label>SECRET ACCESS KEY</label>
                <input type="password" id="accessKey" placeholder="ENTER PIN...">
            </div>
            
            <button class="deploy-btn" onclick="authenticate()">VERIFY IDENTITY</button>
            <div id="error" class="error-msg" style="display:none;">ACCESS DENIED: INVALID CREDENTIALS</div>
        </div>

        <div id="profileCard" class="card hidden">
            <div class="profile-header">
                <div class="avatar-frame" id="pAvatar"></div>
                <div class="soldier-info">
                    <h1 id="pName">---</h1>
                    <p class="uid-tag" id="pUid">UID: ---</p>
                </div>
            </div>
            
            <div class="stats-row">
                <div class="stat-card"><span>RANK</span><strong id="pRank">---</strong></div>
                <div class="stat-card"><span>K/D</span><strong id="pKd">0.00</strong></div>
                <div class="stat-card"><span>LEVEL</span><strong id="pLvl">0</strong></div>
            </div>

            <p class="admin-seal">AUTHORIZED BY SYSTEM ADMIN: <span class="dev-highlight">KIM POGI</span></p>
            <button class="deploy-btn logout-style" onclick="logout()">ABORT SESSION</button>
        </div>

        <div class="dev-credits">
            <p>SYSTEM ARCHITECT: <span class="dev-name">KIM POGI</span></p>
            <p class="sys-version">VER: 1.0.5-PRIVATE // TERMINAL_OS</p>
        </div>
    </div>

    <script src="function.js"></script>
    <div style="margin-top: 20px;">
    <p style="color: #F39C12; font-size: 14px; margin-bottom: 5px; font-family: 'Courier New', Courier, monospace; letter-spacing: 2px;">
        TOTAL TERMINAL ACCESSES:
    </p>
    <img src="https://count.getloli.com/get/@kimput-codm-v2?theme=asoul" alt="Visitor Count" style="filter: hue-rotate(160deg) brightness(1.2); height: 35px;">
</div>
</body>
</html>
